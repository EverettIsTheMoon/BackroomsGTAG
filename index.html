<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b6a96e">
<title>BackroomsGTAG</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17170f;color:#fff}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,3vw,28px);text-shadow:0 2px 8px #000}#top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}#brand{font-weight:900;letter-spacing:.13em;font-size:clamp(15px,3vw,22px)}#status{font-size:12px;color:#ded8ad;margin-top:4px}#panel{align-self:center;max-width:540px;width:100%;margin:auto 0;background:#15150edb;border:1px solid #d5c77b55;border-radius:18px;padding:clamp(20px,5vw,36px);text-align:center;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 18px 70px #0009}h1{margin:0 0 8px;font-size:clamp(28px,7vw,48px);letter-spacing:.04em}p{color:#d8d3b2;line-height:1.5;margin:8px 0 20px}button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;color:#1d1b10;background:#e2d48a;margin:4px}button.secondary{background:#363528;color:#eee8c7;border:1px solid #77704a}#bottom{font-size:12px;color:#d0cba8;display:flex;justify-content:space-between;gap:12px}#hint{max-width:75%}.hidden{display:none!important}@media(max-width:520px){#bottom{font-size:10px}#panel{margin:auto 0}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">
 <div id="top"><div><div id="brand">BACKROOMS<span style="color:#e2d48a">GTAG</span></div><div id="status">PROTOTYPE 0.1 · LIMINAL ZONE</div></div><button id="reset" class="secondary">RESET</button></div>
 <section id="panel"><h1>DON'T GET LOST.</h1><p>A quiet place that should not exist. Enter the maze, push off the walls, and listen carefully.</p><button id="enter">ENTER VR</button><button id="start" class="secondary">PLAY WITHOUT VR</button><p style="font-size:12px;margin:14px 0 0">Best in Meta Quest Browser · Headphones recommended</p></section>
 <div id="bottom"><span id="hint">VR: push your hands against surfaces to move.</span><span>NO EXIT FOUND</span></div>
</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9ad73);
scene.fog = new THREE.FogExp2(0xb9ad73, 0.027);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 90);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight); renderer.xr.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const floorMat=mat(0x77704a), wallMat=mat(0xc4b875), wallAlt=mat(0xb9ac6a), ceilingMat=mat(0x8c875f), trimMat=mat(0x777044), lightMat=new THREE.MeshBasicMaterial({color:0xfff0bd});
const wallBoxes=[];
const mazeSize=13, cell=4, wallH=3.2, half=mazeSize*cell/2;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(mazeSize*cell,mazeSize*cell),floorMat);
floor.rotation.x=-Math.PI/2; floor.position.y=0; scene.add(floor);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(mazeSize*cell,mazeSize*cell),ceilingMat);
ceiling.rotation.x=Math.PI/2; ceiling.position.y=wallH; scene.add(ceiling);
const grid=Array.from({length:mazeSize},()=>Array.from({length:mazeSize},()=>({seen:false,w:[true,true,true,true]})));
const dirs=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
// Depth-first maze carving keeps a continuous route through the level.
const stack=[[0,0]];grid[0][0].seen=true;
while(stack.length){const [x,z]=stack[stack.length-1];const opts=dirs.map(d=>[x+d[0],z+d[1],d]).filter(([nx,nz])=>nx>=0&&nz>=0&&nx<mazeSize&&nz<mazeSize&&!grid[nz][nx].seen);if(!opts.length){stack.pop();continue;}const [nx,nz,d]=opts[Math.floor(Math.random()*opts.length)];grid[z][x].w[d[2]]=false;grid[nz][nx].w[d[3]]=false;grid[nz][nx].seen=true;stack.push([nx,nz]);}
// Widen a few connectors to create slightly less uniform hallways.
for(let z=1;z<mazeSize-1;z+=3) for(let x=1;x<mazeSize-1;x+=4){if(Math.random()<.65){grid[z][x].w[1]=false;grid[z+1][x].w[3]=false;}}
const wallGeo=new THREE.BoxGeometry(cell,wallH,.16);
function addWall(x,z,orientation){const m=new THREE.Mesh(wallGeo,Math.random()<.24?wallAlt:wallMat);m.position.set(x,wallH/2,z);if(orientation==='x')m.rotation.y=Math.PI/2;scene.add(m);const b=new THREE.Box3().setFromObject(m);wallBoxes.push({minX:b.min.x,maxX:b.max.x,minZ:b.min.z,maxZ:b.max.z,minY:0,maxY:wallH});}
for(let z=0;z<mazeSize;z++)for(let x=0;x<mazeSize;x++){
 const cx=(x-mazeSize/2+.5)*cell, cz=(z-mazeSize/2+.5)*cell, w=grid[z][x].w;
 if(w[0])addWall(cx-cell/2,cz,'x');
 if(w[3])addWall(cx,cz-cell/2,'z');
 if(x===mazeSize-1&&w[2])addWall(cx+cell/2,cz,'x');
 if(z===mazeSize-1&&w[1])addWall(cx,cz+cell/2,'z');
 // Simple baseboard gives scale without lots of geometry.
}
const lightGeo=new THREE.BoxGeometry(1.15,.035,.42);
for(let z=0;z<mazeSize;z+=2)for(let x=0;x<mazeSize;x+=2){
 const lx=(x-mazeSize/2+.5)*cell,lz=(z-mazeSize/2+.5)*cell;
 const panel=new THREE.Mesh(lightGeo,lightMat);panel.position.set(lx,wallH-.035,lz);scene.add(panel);
 const lamp=new THREE.PointLight(0xffe9a8,.48,7,2);lamp.position.set(lx,wallH-.18,lz);scene.add(lamp);
}
const baseboardGeo=new THREE.BoxGeometry(cell,.12,.08);
for(let i=0;i<mazeSize;i++){const p=(i-mazeSize/2+.5)*cell;const a=new THREE.Mesh(baseboardGeo,trimMat);a.position.set(p,.07,-half);scene.add(a);}
// Exit sign is intentionally misleading: the door is blocked.
const sign=new THREE.Mesh(new THREE.BoxGeometry(.85,.35,.08),mat(0x29351d));sign.position.set(0,2.5,-half+1);scene.add(sign);
const signText=new THREE.Mesh(new THREE.PlaneGeometry(.72,.22),new THREE.MeshBasicMaterial({color:0x8bd477}));signText.position.set(0,2.5,-half+.94);scene.add(signText);

// Controller hands are intentionally simple, cheap capsule-like meshes.
const controllers=[renderer.xr.getController(0),renderer.xr.getController(1)];
const hands=[], handAnchors=[null,null], wasTouching=[false,false];
for(let i=0;i<2;i++){const c=controllers[i];rig.add(c);const hand=new THREE.Mesh(new THREE.SphereGeometry(.105,10,8),new THREE.MeshStandardMaterial({color:i===0?0xd8c18a:0xb9c6c7,roughness:.8}));c.add(hand);hands.push(hand);const ray=renderer.xr.getControllerGrip(i);rig.add(ray);}
const velocity=new THREE.Vector3();const clock=new THREE.Clock();let started=false, desktop=false, yaw=0, pitch=0, keys={};let lastPlayerMove=new THREE.Vector3();
const playerRadius=.22, virtualHeadHeight=1.62;
function collides(x,z){if(Math.abs(x)>half-.25||Math.abs(z)>half-.25)return true;for(const b of wallBoxes){if(b.maxY<.25)continue;if(x+playerRadius>b.minX&&x-playerRadius<b.maxX&&z+playerRadius>b.minZ&&z-playerRadius<b.maxZ)return true;}return false;}
function reset(){rig.position.set(-half+cell*.7,0,half-cell*.7);velocity.set(0,0,0);yaw=0;pitch=0;camera.rotation.set(0,0,0);handAnchors.fill(null);wasTouching.fill(false);lastPlayerMove.set(0,0,0);}
reset();
function startDesktop(){desktop=true;started=true;document.getElementById('panel').classList.add('hidden');document.getElementById('hint').textContent='WASD to move · Drag to look · Find a way out.';renderer.setAnimationLoop(animate);}
document.getElementById('start').addEventListener('click',startDesktop);
document.getElementById('enter').addEventListener('click',async()=>{try{const s=await navigator.xr?.isSessionSupported('immersive-vr');if(!s){document.getElementById('hint').textContent='VR is not available in this browser. Try Play Without VR.';return;}const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});await renderer.xr.setSession(session);started=true;desktop=false;document.getElementById('panel').classList.add('hidden');document.getElementById('hint').textContent='Push your hands against the floor or walls to move.';renderer.setAnimationLoop(animate);}catch(e){document.getElementById('hint').textContent='Could not enter VR: '+e.message;}});
document.getElementById('reset').addEventListener('click',reset);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'){document.getElementById('panel').classList.remove('hidden');}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(!desktop)return;dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointermove',e=>{if(!desktop||!dragging)return;yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY;});
function handTouches(p){if(p.y<.20)return true;for(const b of wallBoxes){if(p.y>.1&&p.y<wallH+.12&&p.x>b.minX-.13&&p.x<b.maxX+.13&&p.z>b.minZ-.13&&p.z<b.maxZ+.13)return true;}return false;}
function animate(){
 const dt=Math.min(clock.getDelta(),.035);
 // Lock virtual head height: real-world standing/crouching is not used to raise/lower the in-game avatar.
 if(renderer.xr.isPresenting){rig.position.y=virtualHeadHeight-camera.position.y;}
 if(desktop&&started){camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const wish=new THREE.Vector3();if(keys.w)wish.add(forward);if(keys.s)wish.sub(forward);if(keys.d)wish.add(right);if(keys.a)wish.sub(right);if(wish.lengthSq())wish.normalize().multiplyScalar(3.2*dt);const nx=rig.position.x+wish.x,nz=rig.position.z+wish.z;if(!collides(nx,rig.position.z))rig.position.x=nx;if(!collides(rig.position.x,nz))rig.position.z=nz;}
 else if(renderer.xr.isPresenting&&started){
   const correction=new THREE.Vector3();let anyTouch=false;
   for(let i=0;i<controllers.length;i++){
     const c=controllers[i], p=new THREE.Vector3();c.getWorldPosition(p);
     const touching=handTouches(p);anyTouch=anyTouch||touching;
     // Plant a hand anchor on first contact; keep it approximately fixed while pushing.
     if(touching&&!wasTouching[i])handAnchors[i]=p.clone();
     if(touching&&handAnchors[i]){
       const delta=handAnchors[i].clone().sub(p);delta.y=0;
       if(delta.lengthSq()<1.0)correction.add(delta);
       else handAnchors[i]=p.clone(); // ignore sudden tracking jumps
     }
     if(!touching)handAnchors[i]=null;
     wasTouching[i]=touching;
   }
   correction.clampLength(0,0.12);
   let movedX=0,movedZ=0;
   if(anyTouch){
     if(!collides(rig.position.x+correction.x,rig.position.z)){rig.position.x+=correction.x;movedX=correction.x;}
     if(!collides(rig.position.x,rig.position.z+correction.z)){rig.position.z+=correction.z;movedZ=correction.z;}
     // Keep only a modest release impulse; don't add a second movement while hands are planted.
     velocity.x=movedX/dt*.12;velocity.z=movedZ/dt*.12;
   }else{
     velocity.x*=Math.pow(.24,dt);velocity.z*=Math.pow(.24,dt);
     const driftX=velocity.x*dt,driftZ=velocity.z*dt;
     if(!collides(rig.position.x+driftX,rig.position.z)){rig.position.x+=driftX;movedX=driftX;}else velocity.x=0;
     if(!collides(rig.position.x,rig.position.z+driftZ)){rig.position.z+=driftZ;movedZ=driftZ;}else velocity.z=0;
   }
   lastPlayerMove.set(movedX,0,movedZ);
 }
 if(!started){const t=performance.now()*.00008;camera.position.set(Math.sin(t)*.05,1.62,0);camera.lookAt(Math.sin(t+1)*.1,1.6,-3);}
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));});
</script>
</body>
</html>
